name: Verify bridge protocol

on:
  push:
  pull_request:

jobs:
  unix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
      - run: bash -n scripts/mac/install_bridge.sh scripts/mac/compile_editor_arm64.sh
      - run: python -m py_compile templates/ue5.4/Content/Python/*.py templates/ue5.4/Saved/CodexScripts/*.py

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/windows/install_bridge.ps1"),
            [ref]$tokens,
            [ref]$parseErrors
          )
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
      - name: Verify repeat install preserves task
        shell: pwsh
        run: |
          $project = Join-Path $env:RUNNER_TEMP "Bridge Test Project"
          New-Item -ItemType Directory -Force -Path $project | Out-Null
          Set-Content -Path (Join-Path $project "Test.uproject") -Value "{}"
          & "scripts/windows/install_bridge.ps1" -ProjectDir $project
          $task = Join-Path $project "Saved/CodexScripts/run_task.py"
          Set-Content -Path $task -Value "# preserve me"
          & "scripts/windows/install_bridge.ps1" -ProjectDir $project
          if ((Get-Content -Raw $task) -notmatch "preserve me") {
            throw "Installer overwrote the existing task script"
          }
